# 个人信息（PII）规则
# 说明：正则捕获组 1 为待校验的值；validator 用于压制误报。

rules:
  - id: pii-cn-mobile-labeled
    severity: high
    description: 带标签的中国大陆手机号
    pattern: |-
      (?i)(?:手机号?|手机号码|联系电话|联系方式|电话|phone|mobile|tel(?:ephone)?)\s*[:=：]?\s*["']?([1][3-9]\d{9})["']?
    validator: cn_mobile
    recommendation: 真实手机号不应出现在代码 / 配置 / 日志中，请改用测试数据或脱敏数据。

  - id: pii-cn-mobile-bare
    severity: medium
    description: 疑似中国大陆手机号
    pattern: |-
      (?<![0-9\-])([1][3-9]\d{9})(?![0-9\-])
    validator: cn_mobile
    hash_guard: true
    recommendation: 确认是否为真实用户手机号；如为测试数据请显式标注。

  - id: pii-cn-id-card
    severity: critical
    description: 中国大陆居民身份证号
    pattern: |-
      (?<![0-9Xx])([1-9]\d{5}(?:19|20)\d{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12]\d|3[01])\d{3}[0-9Xx])(?![0-9Xx])
    validator: cn_id
    hash_guard: true
    recommendation: 身份证号属于敏感个人信息，立即删除并按合规要求处理；若为脱敏样本请标注。

  - id: pii-cn-bank-card
    severity: high
    description: 银行卡号
    pattern: |-
      (?<![0-9])([0-9]{16,19})(?![0-9])
    validator: luhn
    hash_guard: true
    recommendation: 银行卡号属于敏感个人信息，请删除并改用测试卡号。

  - id: pii-cn-bank-card-labeled
    severity: critical
    description: 带标签的银行卡号
    pattern: |-
      (?i)(?:银行卡|卡号|银行账号|bank\s*card|card\s*(?:no|number))\s*[:=：]?\s*["']?([0-9]{13,19})["']?
    validator: luhn
    recommendation: 请立即删除该卡号并通知持卡人。

  - id: pii-email-address
    severity: medium
    description: 邮箱地址
    pattern: |-
      \b([A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,})\b
    recommendation: 确认该邮箱是否为真实个人邮箱；测试请使用 example.com 之类保留域名。

  - id: pii-email-labeled
    severity: high
    description: 带标签的邮箱地址
    pattern: |-
      (?i)(?:email|e-mail|邮箱|邮件地址|联系方式)\s*[:=：]\s*["']?([A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,})["']?
    recommendation: 请改用占位邮箱或环境变量注入。

  - id: pii-us-ssn
    severity: high
    description: 美国社会安全号
    pattern: |-
      (?i)(?:ssn|social\s*security\s*(?:no|number))\s*[:=：]?\s*["']?([0-9]{3}-[0-9]{2}-[0-9]{4})["']?
    recommendation: 属于受监管的个人信息，请删除。

  - id: pii-passport-number
    severity: medium
    description: 护照 / 通行证号
    pattern: |-
      (?i:护照号?|passport|通行证)\s*[:=：]?\s*["']?([A-Z0-9]{6,12})["']?
    recommendation: 属于个人证件信息，请删除。

  - id: pii-cn-address
    severity: medium
    description: 带标签的居住地址
    pattern: |-
      (?:家庭住址|住址|地址|收货地址|address)\s*[:=：]\s*["']?([一-龥]{2,8}(?:省|自治区|市)[一-龥\d]{2,40})
    recommendation: 住址属于个人敏感信息，请删除并改用虚拟地址。

  - id: pii-mac-address
    severity: low
    description: MAC 地址
    pattern: |-
      \b((?:[0-9A-Fa-f]{2}[:-]){5}[0-9A-Fa-f]{2})\b
    validator: mac
    recommendation: 属于设备标识信息，通常不应硬编码。

  - id: pii-internal-ip
    severity: low
    description: 内网 IP 地址
    pattern: |-
      \b(10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})\b
    recommendation: 内网地址会泄露基础设施信息，建议改为配置项。

# 文件名中夹带个人数据
pii_files:
  - id: pii-file-id-number
    pattern: '(?i)(^|/)[^/]*[^0-9a-z]([0-9]{15,18}[Xx]?)[^/]*$'
    description: 文件名中疑似包含证件号 / 卡号
    severity: medium
    recommendation: 重命名文件，避免把个人数据写进文件名。

  - id: pii-file-mobile
    pattern: '(?i)(^|/)[^/]*?([1][3-9][0-9]{9})[^/]*$'
    description: 文件名中疑似包含手机号
    severity: medium
    recommendation: 重命名文件，避免把个人数据写进文件名。
