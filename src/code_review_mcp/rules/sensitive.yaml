# 敏感信息规则（密钥 / 令牌 / 口令 / 私钥）
# 字段说明:
#   id            规则唯一标识
#   severity      critical | high | medium | low | info
#   pattern       正则；捕获组 1 为待校验的值
#   prefilter     可选；大小写不敏感的子串预筛，多个用 | 分隔，用于加速
#   validator     可选；luhn / cn_id / cn_mobile / mac / entropy，对捕获组做二次确认
#   extensions    可选；仅对这些扩展名的文件生效
#   exclude_dirs  可选；命中这些目录时跳过（如 examples / fixtures）

rules:
  - id: aws-access-key-id
    severity: critical
    description: AWS Access Key ID
    pattern: |-
      \b(?:AKIA|ASIA|ABIA|ACCA|A3T[A-Z0-9])[A-Z0-9]{16}\b
    prefilter: akia|asia|abia|acca
    recommendation: 立即在 AWS IAM 控制台吊销并轮换该密钥，从代码中删除，改由环境变量或 Secrets Manager 注入。

  - id: aws-secret-access-key
    severity: critical
    description: AWS Secret Access Key
    pattern: |-
      (?i)aws_secret_access_key\s*[:=]\s*['"]?([A-Za-z0-9/+=]{40})['"]?
    prefilter: aws_secret
    recommendation: 立即轮换该密钥，并检查是否已推送到远端仓库（历史提交同样需要清理）。

  - id: google-api-key
    severity: critical
    description: Google / Firebase API Key
    pattern: |-
      \bAIza[0-9A-Za-z\-_]{35}\b
    prefilter: aiza
    recommendation: 到 Google Cloud Console 吊销该 Key 并改用服务账号或环境变量注入。

  - id: google-oauth-client-secret
    severity: high
    description: Google OAuth Client Secret
    pattern: |-
      \bGOCSPX-[A-Za-z0-9_\-]{20,}\b
    prefilter: gocspx
    recommendation: 在 GCP 控制台重置客户端密钥。

  - id: github-token
    severity: critical
    description: GitHub Token / PAT
    pattern: |-
      \b(?:gh[pousr]_[A-Za-z0-9]{36,255}|github_pat_[A-Za-z0-9_]{22,255})\b
    prefilter: ghp_|gho_|ghu_|ghs_|ghr_|github_pat_
    recommendation: 立即在 GitHub Settings → Developer settings 撤销该 Token。

  - id: gitlab-pat
    severity: critical
    description: GitLab Personal Access Token
    pattern: |-
      \bglpat-[A-Za-z0-9_\-]{20}\b
    prefilter: glpat-
    recommendation: 立即在 GitLab User settings 中吊销该 Token。

  - id: npm-token
    severity: critical
    description: npm Access Token
    pattern: |-
      \bnpm_[A-Za-z0-9]{36}\b
    prefilter: npm_
    recommendation: 在 npmjs.com 撤销该 token 并改用 npm automation token。

  - id: pypi-token
    severity: critical
    description: PyPI Upload Token
    pattern: |-
      \bpypi-AgEIcHlwaS5vcmc[A-Za-z0-9_\-]{50,}
    prefilter: pypi-ageic
    recommendation: 在 PyPI 账户设置中吊销该 API token。

  - id: slack-token
    severity: critical
    description: Slack Token
    pattern: |-
      \bxox[baprs]-[A-Za-z0-9\-]{10,}
    prefilter: xox
    recommendation: 在 Slack App 管理页吊销该 token。

  - id: slack-webhook
    severity: high
    description: Slack Incoming Webhook URL
    pattern: |-
      https://hooks\.slack\.com/services/T[A-Za-z0-9_]{8,}/B[A-Za-z0-9_]{8,}/[A-Za-z0-9_]{16,}
    prefilter: hooks.slack.com
    recommendation: 删除该 webhook 并重新生成。

  - id: stripe-secret-key
    severity: critical
    description: Stripe 私钥 / 受限密钥
    pattern: |-
      \b(?:sk|rk)_live_[0-9A-Za-z]{16,}\b
    prefilter: _live_
    recommendation: 在 Stripe Dashboard 轮换该密钥。

  - id: stripe-webhook-secret
    severity: high
    description: Stripe Webhook 签名密钥
    pattern: |-
      \bwhsec_[A-Za-z0-9]{32,}\b
    prefilter: whsec_
    recommendation: 在 Stripe Dashboard 重新生成 webhook secret。

  - id: openai-api-key
    severity: critical
    description: OpenAI API Key
    pattern: |-
      \bsk-(?:proj-)?[A-Za-z0-9_\-]{32,}\b
    prefilter: sk-proj|sk-
    recommendation: 立即在 OpenAI 平台吊销该 key。

  - id: anthropic-api-key
    severity: critical
    description: Anthropic API Key
    pattern: |-
      \bsk-ant-[A-Za-z0-9_\-]{24,}\b
    prefilter: sk-ant-
    recommendation: 立即在 Anthropic Console 吊销该 key。

  - id: huggingface-token
    severity: high
    description: Hugging Face Access Token
    pattern: |-
      \bhf_[A-Za-z0-9]{30,}\b
    prefilter: hf_
    recommendation: 在 Hugging Face 设置中吊销该 token。

  - id: aliyun-access-key
    severity: critical
    description: 阿里云 AccessKey ID
    pattern: |-
      \bLTAI[0-9A-Za-z]{16,32}\b
    prefilter: ltai
    recommendation: 在阿里云 RAM 控制台禁用并轮换该 AccessKey。

  - id: tencent-secret-id
    severity: critical
    description: 腾讯云 SecretId
    pattern: |-
      \bAKID[0-9A-Za-z]{28,40}\b
    prefilter: akid
    recommendation: 在腾讯云 CAM 控制台禁用该子账号密钥。

  - id: jira-api-token
    severity: high
    description: Atlassian / Jira API Token
    pattern: |-
      \bATATT3x[A-Za-z0-9_\-=]{20,}
    prefilter: atatt3x
    recommendation: 在 Atlassian 账号设置中撤销该 token。

  - id: sendgrid-api-key
    severity: high
    description: SendGrid API Key
    pattern: |-
      \bSG\.[A-Za-z0-9_\-]{16,}\.[A-Za-z0-9_\-]{16,}
    prefilter: sg.
    recommendation: 在 SendGrid 设置中撤销该 API key。

  - id: mailgun-api-key
    severity: high
    description: Mailgun API Key
    pattern: |-
      \bkey-[0-9a-f]{32}\b
    prefilter: key-
    recommendation: 在 Mailgun 控制台撤销该 key。

  - id: twilio-account-sid
    severity: medium
    description: Twilio Account SID
    pattern: |-
      \bAC[0-9a-f]{32}\b
    prefilter: ac
    recommendation: SID 本身非机密，但若同时出现 Auth Token 应立即轮换。

  - id: private-key-block
    severity: critical
    description: 私钥文件内容
    pattern: |-
      -----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY(?: BLOCK)?-----
    recommendation: 私钥绝不能入库；立即生成新密钥对，并把旧私钥从仓库历史中清除。

  - id: putty-private-key
    severity: critical
    description: PuTTY 私钥文件
    pattern: |-
      PuTTY-User-Key-File-\d
    recommendation: 私钥不得入库；立即更换密钥对。

  - id: jwt-token
    severity: high
    description: JWT 令牌
    pattern: |-
      \beyJ[A-Za-z0-9_\-]{8,}\.eyJ[A-Za-z0-9_\-]{8,}\.[A-Za-z0-9_\-]{8,}
    prefilter: eyj
    recommendation: JWT 通常是签发出来的凭据，不要硬编码；确认其是否已过期并轮换签发密钥。

  - id: basic-auth-url
    severity: high
    description: URL 内嵌 Basic 认证用户名/口令
    pattern: |-
      [a-zA-Z][a-zA-Z0-9+.\-]*://[^\s/:@]+:([^\s/:@]{3,})@
    recommendation: 移除 URL 中的凭据，改用请求头 + 环境变量。

  - id: connection-string-password
    severity: critical
    description: 数据库 / 中间件连接串中的明文口令
    pattern: |-
      (?:mongodb(?:\+srv)?|mysql|postgres(?:ql)?|redis|amqps?|ftps?|jdbc:[a-z0-9]+)://[^\s:/@]+:([^\s@/]{3,})@
    recommendation: 立即轮换该账号口令，改用密钥管理服务注入连接串。

  - id: npmrc-auth-token
    severity: critical
    description: .npmrc 中的认证 token
    pattern: |-
      (?m)^\s*_authToken\s*=\s*(\S{8,})
    recommendation: 撤销该 npm token，并确保 .npmrc 不入库。

  - id: pypirc-password
    severity: high
    description: .pypirc 中的上传口令
    pattern: |-
      (?m)^\s*password\s*=\s*(\S{6,})
    recommendation: 撤销该 PyPI token，并确保 .pypirc 不入库。

  - id: netrc-password
    severity: high
    description: .netrc 中的明文口令
    pattern: |-
      (?m)^password\s+(\S{3,})
    recommendation: 从 .netrc 中移除口令，改用密钥管理服务。

  - id: htpasswd-entry
    severity: medium
    description: .htpasswd 中的口令哈希
    pattern: |-
      (?m)^[A-Za-z0-9._\-]+:\$(?:apr1|2[aby]|1|5|6)\$
    recommendation: 该文件不应入库；确认哈希是否可被离线破解并考虑轮换口令。

  - id: service-account-json
    severity: critical
    description: 云服务账号私钥 JSON
    pattern: |-
      "type"\s*:\s*"service_account"
    recommendation: 该文件含私钥，必须从仓库移除并轮换密钥对。

  - id: bearer-token-literal
    severity: high
    description: 硬编码的 Authorization Bearer 令牌
    pattern: |-
      (?i)authorization["']?\s*[:=]\s*["'](?:bearer\s+)?([A-Za-z0-9_\-\.=+/]{16,})["']
    prefilter: authorization
    recommendation: 令牌应从环境变量或密钥管理服务读取。

  - id: presigned-url-signature
    severity: high
    description: 预签名 URL 中的签名参数
    pattern: |-
      (?i)(?:X-Amz-Signature|Signature)=([0-9a-f]{16,})
    recommendation: 预签名 URL 属于临时凭据，不要硬编码进代码。

  - id: generic-credential-assignment
    severity: high
    description: 硬编码的密码 / 密钥赋值
    pattern: |-
      (?i)\b(?:password|passwd|pwd|secret|secret_key|api[_-]?key|apikey|access[_-]?key|access[_-]?token|auth[_-]?token|client[_-]?secret|private[_-]?key|encryption[_-]?key)\b\s*[:=]\s*["']([^"'\s${}]{6,})["']
    prefilter: password|passwd|pwd|secret|api_key|apikey|access_key|access_token|auth_token|client_secret|private_key|encryption_key
    recommendation: 改为从环境变量 / 密钥管理服务读取，并轮换已经泄露的凭据。

  - id: high-entropy-assignment
    severity: medium
    description: 高熵值的疑似密钥赋值
    pattern: |-
      (?i)\b(?:key|token|secret|credential|passphrase|signing)\b\s*[:=]\s*["']([A-Za-z0-9+/=_\-]{20,})["']
    prefilter: key|token|secret|credential|passphrase|signing
    validator: entropy
    recommendation: 该值具备密钥特征，请确认是否为真实凭据并改用外部注入。

  - id: dingtalk-webhook
    severity: medium
    description: 钉钉 / 企业微信机器人 Webhook
    pattern: |-
      https://(?:oapi\.dingtalk\.com/robot/send\?access_token=|qyapi\.weixin\.qq\.com/cgi-bin/webhook/send\?key=)[A-Za-z0-9_\-]{20,}
    recommendation: Webhook URL 等同于口令，请重新生成并改用环境变量。

# 按文件名 / 路径命中的高危文件（与内容无关）
sensitive_files:
  - id: sensitive-dotenv
    pattern: '(?i)(^|/)\.env(\.(?!example|sample|template|dist)[A-Za-z0-9_\-]+)?$'
    description: 环境变量文件（可能含真实凭据）
    severity: high
    recommendation: 确认该文件未被提交；真实凭据应在部署时注入，仓库只保留 .env.example。

  - id: sensitive-env-example
    pattern: '(?i)(^|/)\.env\.(example|sample|template|dist)$'
    description: 环境变量模板文件
    severity: info
    recommendation: 模板文件可以入库，但需确认其中的值均为占位符。

  - id: sensitive-private-key-file
    pattern: '(?i)(^|/)(id_rsa|id_dsa|id_ecdsa|id_ed25519|\.ssh/.*)$'
    description: SSH 私钥文件
    severity: critical
    recommendation: 私钥必须移出仓库并更换密钥对。

  - id: sensitive-credential-file
    pattern: '(?i)(^|/)(\.npmrc|\.pypirc|\.netrc|\.htpasswd|credentials|credentials\.json|secrets?\.(ya?ml|json|env|toml)|service[-_]account.*\.json)$'
    description: 凭据配置文件
    severity: high
    recommendation: 确认凭据已轮换，并确保该文件被 .gitignore 忽略。

  - id: sensitive-key-material
    pattern: '(?i)\.(pem|key|p12|pfx|jks|keystore|ppk|ovpn)$'
    description: 密钥 / 证书私钥文件
    severity: high
    recommendation: 私钥材料不应入库，确认为公开证书或改用密钥管理服务。

  - id: sensitive-terraform-vars
    pattern: '(?i)(^|/)[\w\-]*\.tfvars(\.json)?$'
    description: Terraform 变量文件
    severity: high
    recommendation: 真实 tfvars 不应入库，改由 CI 变量注入。
